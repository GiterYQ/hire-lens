<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>定制简历_{{COMPANY_NAME}}_{{JOB_TITLE}}</title>
  <style>
    @page {
      size: A4;
      margin: 11mm 14mm;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #1e293b;
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 28px 20px;
    }
    /* A4 纸张画布 */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      padding: 13mm 15mm;
      border-radius: 6px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      outline: none;
      font-size: 9.4pt;
      line-height: 1.48;
    }
    .a4-sheet:focus {
      box-shadow: 0 0 0 2px #10b981, 0 20px 50px rgba(0,0,0,0.45);
    }
    .a4-sheet h1 {
      font-size: 17pt;
      color: #0f172a;
      border-bottom: 1.5px solid #0f172a;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .a4-sheet h2 {
      font-size: 10.5pt;
      color: #0f172a;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 2px;
      margin-top: 10px;
      margin-bottom: 6px;
    }
    .a4-sheet h3 {
      font-size: 9.6pt;
      color: #0f766e;
      margin-top: 7px;
      margin-bottom: 3px;
    }
    .a4-sheet p {
      margin-bottom: 4px;
      color: #334155;
    }
    .a4-sheet ul {
      padding-left: 15px;
      margin-bottom: 5px;
    }
    .a4-sheet li {
      margin-bottom: 2.5px;
      text-align: justify;
    }
    /* 右侧靶向核对辅助栏（打印时自动隐藏） */
    .helper-panel {
      width: 320px;
      position: sticky;
      top: 24px;
      align-self: flex-start;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .helper-panel h4 {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .target-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }
    .kw-wrap { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .kw {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #334155;
      color: #cbd5e1;
    }
    .kw.ok { background: rgba(16,185,129,0.16); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.35); }
    .kw.warn { background: rgba(245,158,11,0.16); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
    .helper-panel ul { padding-left: 16px; color: #cbd5e1; margin-bottom: 14px; }
    .helper-panel li { margin-bottom: 6px; }
    .btn-print {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 9px;
      background: #10b981;
      color: #052e16;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-print:hover { background: #34d399; }
    .hint { font-size: 11.5px; color: #94a3b8; margin-top: 8px; }

    @media print {
      body { background: #ffffff; padding: 0; display: block; }
      .helper-panel { display: none !important; }
      .a4-sheet {
        width: 100%;
        min-height: auto;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <main class="a4-sheet" contenteditable="true" spellcheck="false">
    {{RESUME_BODY_HTML}}
  </main>

  <aside class="helper-panel">
    <h4>🎯 岗位靶向微调台</h4>
    <div class="target-box">
      <div><strong>{{COMPANY_NAME}}</strong> · {{JOB_TITLE}}</div>
      <div style="color:#34d399; font-size:12px; margin-top:2px;">综合匹配度：{{MATCH_SCORE}} / 100</div>
    </div>

    <div style="margin-bottom:4px; font-weight:600;">✅ 已命中关键词</div>
    <div class="kw-wrap">{{MATCHED_BADGES}}</div>

    <div style="margin-bottom:4px; font-weight:600;">⚠️ 待关注缺口词</div>
    <div class="kw-wrap">{{MISSING_BADGES}}</div>

    <div style="margin-bottom:4px; font-weight:600;">📌 微调建议（左侧纸张可直接点击改字）</div>
    <ul>{{TWEAKS_HTML}}</ul>

    <button class="btn-print" onclick="window.print()">🖨️ 打印 / 另存为定制 PDF</button>
    <p class="hint">提示：左侧白色 A4 简历支持直接点击修改文字；按打印时本右侧深色辅助栏会自动隐藏，输出纯白净版 PDF。</p>
  </aside>

</body>
</html>
