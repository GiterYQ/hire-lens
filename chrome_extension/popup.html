<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 12px;
      line-height: 1.5;
    }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-weight: 800; font-size: 13.5px; color: #00bebd; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    select, textarea {
      width: 100%; background: #1e293b; border: 1px solid #334155;
      color: #f1f5f9; border-radius: 7px; padding: 6px 8px; font-size: 12px;
    }
    button { padding: 7px 10px; border-radius: 7px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn-main { width: 100%; background: #00bebd; color: #042f2e; }
    .btn-main:disabled { opacity: 0.6; }
    .btn-sub { flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 9px 10px; margin-top: 10px; }
    .score { font-size: 20px; font-weight: 800; color: #00bebd; }
    .muted { color: #94a3b8; font-size: 11px; }
    .lbl { font-size: 11px; font-weight: 700; color: #cbd5e1; margin: 6px 0 3px; display: block; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="head">
    <span class="title">🔭 HireLens 聘镜 Clipper</span>
    <a href="http://127.0.0.1:8765" target="_blank" style="color:#38bdf8; font-size:11.5px; text-decoration:none;">打开招聘端模拟台 ↗</a>
  </div>

  <div class="row">
    <select id="lang">
      <option value="zh-CN">简体（BOSS / 猎聘）</option>
      <option value="zh-HK">繁體（香港 JobsDB）</option>
      <option value="en">English（LinkedIn）</option>
    </select>
  </div>

  <button id="btn-clip" class="btn-main">⚡ 一键剪藏当前招聘页并生成双文案</button>
  <div id="status" class="muted" style="margin-top:6px;">提示：请确保本机 HireLens (127.0.0.1:8765) 已启动</div>

  <div id="res-box" class="box hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <div>
        <div id="res-job" style="font-weight:700;"></div>
        <div id="res-track" class="muted"></div>
      </div>
      <div class="score" id="res-score">--</div>
    </div>
    <div id="res-veto" style="font-size:11px; margin-bottom:5px; color:#fcd34d;"></div>

    <span class="lbl">① 打招呼破冰语（前16字外露重点前置）</span>
    <textarea id="res-greeting" rows="3"></textarea>
    <div class="row" style="margin-top:5px;">
      <button id="btn-copy" class="btn-sub">📋 复制破冰语</button>
      <button id="btn-fill" class="btn-sub">✍️ 填入当前聊天框</button>
    </div>

    <span class="lbl">② BOSS 个人优势（牛人推荐卡片曝光）</span>
    <textarea id="res-adv" rows="3"></textarea>
    <div class="row" style="margin-top:5px; margin-bottom:0;">
      <button id="btn-copy-adv" class="btn-sub">📋 复制个人优势去更新简历</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
